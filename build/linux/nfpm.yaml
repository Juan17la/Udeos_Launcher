# nfpm (https://nfpm.goreleaser.com) turns the binary that `wails build`
# leaves in build/bin/ into .deb and .rpm packages. Used by the Release
# workflow; to try it locally:
#   VERSION=1.0.0-alpha nfpm package -f build/linux/nfpm.yaml -p deb
# Run it from the repository root: the paths below are relative to it.
name: udeos-launcher
arch: amd64
platform: linux
version: ${VERSION}
section: games
priority: optional
maintainer: Juan Diego López Arias
description: |
  A Minecraft launcher that runs without a Microsoft account.
  Pick a nickname, create a vanilla, Fabric, Forge, NeoForge or Quilt instance and play.
vendor: Udeos
homepage: https://github.com/Juan17la/Udeos_Launcher
license: MIT

contents:
  - src: build/bin/udeos-launcher
    dst: /usr/bin/udeos-launcher
    file_info:
      mode: 0755
  - src: build/linux/udeos-launcher.desktop
    dst: /usr/share/applications/udeos-launcher.desktop
    file_info:
      mode: 0644
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/udeos-launcher.png
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
