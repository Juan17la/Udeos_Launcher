# Builds the installers for Linux, Windows and macOS and publishes them on a
# GitHub Release. Runs when a tag such as v1.0.0-alpha is pushed; a manual run
# (workflow_dispatch) only builds and keeps the files as workflow artifacts,
# which is the way to smoke-test the three builders before tagging.
#
# Artifact names: udeos-launcher-<version>-<os>-<arch>.<ext>, where <version>
# is the tag without its leading "v" (or "dev" on a manual run).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.15.0 # keep in sync with go.mod
  NODE_VERSION: "20"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux (deb, rpm, tar.gz)
    needs: version
    runs-on: ubuntu-latest
    # Ubuntu 22.04 has glibc 2.35 and webkit2gtk 4.1, so the binary runs on
    # Ubuntu 22.04+, Debian 12+ and Fedora without depending on the runner image.
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates xz-utils \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/checkout@v7
      - name: Trust the checkout inside the container
        # The workspace is owned by another uid; without this `go build`
        # aborts while stamping VCS info ("dubious ownership").
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: wails build -clean -tags webkit2_41
      - name: Package
        run: |
          mkdir -p dist
          nfpm package -f build/linux/nfpm.yaml -p deb -t "dist/udeos-launcher-${VERSION}-linux-amd64.deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "dist/udeos-launcher-${VERSION}-linux-x86_64.rpm"
          stage="udeos-launcher-${VERSION}-linux-amd64"
          mkdir -p "$stage"
          cp build/bin/udeos-launcher build/linux/udeos-launcher.desktop "$stage/"
          cp build/appicon.png "$stage/udeos-launcher.png"
          tar czf "dist/${stage}.tar.gz" "$stage"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer, portable zip)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - name: Build
        shell: pwsh
        run: wails build -clean -nsis
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem build\bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build\bin" }
          Move-Item $installer.FullName "dist\udeos-launcher-$env:VERSION-windows-amd64-installer.exe"
          Compress-Archive -Path build\bin\udeos-launcher.exe -DestinationPath "dist\udeos-launcher-$env:VERSION-windows-amd64-portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal dmg)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: wails build -clean -platform darwin/universal
      - name: Package
        run: |
          app="build/bin/Udeos Launcher.app"
          # Ad-hoc signature: Apple Silicon refuses to run unsigned binaries and
          # the universal (lipo) step drops the one the Go linker added.
          codesign --force --deep --sign - "$app"
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Udeos Launcher" -srcfolder dmg -ov -format UDZO \
            "dist/udeos-launcher-${VERSION}-macos-universal.dmg"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release title and notes
        id: notes
        shell: bash
        run: |
          title="Udeos Launcher $(echo "$VERSION" | sed -E 's/-alpha/ Alpha/; s/-beta/ Beta/; s/-rc/ RC /')"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat > notes.md <<EOT
          ## Downloads

          | OS | File | Notes |
          |----|------|-------|
          | Windows 10/11 (x64) | \`udeos-launcher-${VERSION}-windows-amd64-installer.exe\` | Installer. SmartScreen may warn because the build is not code-signed: choose *More info → Run anyway*. The portable \`.zip\` needs no install. |
          | macOS 10.13+ (Intel and Apple Silicon) | \`udeos-launcher-${VERSION}-macos-universal.dmg\` | Drag *Udeos Launcher* into *Applications*. The app is not notarized: on first launch right-click → *Open*, or run \`xattr -cr "/Applications/Udeos Launcher.app"\`. |
          | Debian / Ubuntu 22.04+ | \`udeos-launcher-${VERSION}-linux-amd64.deb\` | \`sudo apt install ./udeos-launcher-*.deb\` (pulls in webkit2gtk 4.1). |
          | Fedora / RHEL-like | \`udeos-launcher-${VERSION}-linux-x86_64.rpm\` | \`sudo dnf install ./udeos-launcher-*.rpm\` |
          | Any Linux (x86_64) | \`udeos-launcher-${VERSION}-linux-amd64.tar.gz\` | Portable: needs \`libwebkit2gtk-4.1\` and GTK 3 installed. |

          A Java runtime is **not** required: the launcher downloads the JRE Mojang
          publishes for each Minecraft version on first play. Checksums are in
          \`SHA256SUMS.txt\`.
          EOT
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
